# Prometheus scrapes itself, the host metrics from node_exporter and the
# TCP connection checks from the Python exporter.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: tcp_probe
    static_configs:
      - targets: ["tcp-exporter:9105"]
