# Alert rules for the host and the TCP checks.
# Thresholds are deliberately simple starting points, tune them to the machine.
groups:
  - name: host
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} has stopped responding to scrapes"

      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} has been above 90% for 10 minutes"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.instance }} is over 90% used"

      # tmpfs and overlay mounts come and go with containers, so they are left out
      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% space left"

      # Looks at the last 6 hours of free space and projects it a day ahead
      - alert: DiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} will fill up within 24 hours at its current rate"

  - name: tcp_probe
    rules:
      - alert: EndpointDown
        expr: tcp_probe_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TCP connections to {{ $labels.target }} have been failing for 2 minutes"

      - alert: SlowTcpConnect
        expr: tcp_probe_connect_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Opening a connection to {{ $labels.target }} is taking over 500 ms"
